[project]
name = "mmc_agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  # TODO(verify-on-Learn): pin actual package name and version
  # "agent-framework>=1.0.0",   # pin actual experimental Magentic-supporting version after Microsoft Learn check
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
