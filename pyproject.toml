[project]
name = "mmc_agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  # Microsoft Agent Framework (preview) — D17. Meta package pulls in core + providers.
  "agent-framework>=0.1.0",
  # Foundry IQ = Azure AI Search KB — D16. Preview features need preview SDK.
  "azure-search-documents>=11.6.0b1",
  "azure-identity>=1.17",
  "azure-storage-blob>=12.19",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
