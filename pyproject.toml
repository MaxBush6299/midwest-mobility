[project]
name = "mmc_agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  # Microsoft Agent Framework (preview) — D17. Meta package pulls in core + providers.
  "agent-framework>=0.1.0",
  # Foundry Agents Service SDK (D20) — for portal-managed Foundry agents + tool defs.
  "azure-ai-projects>=2.2.0",
  "azure-monitor-opentelemetry>=1.6.0",
  "azure-ai-agents>=1.2.0b6",
  # Foundry IQ = Azure AI Search KB — D16. Preview features need preview SDK.
  # 12.1.0b1+ is required for IndexedSqlKnowledgeSource (Azure SQL knowledge source).
  "azure-search-documents>=12.1.0b1",
  "azure-identity>=1.17",
  "azure-storage-blob>=12.19",
  # Azure SQL data loading (Pattern A — indexed Azure SQL knowledge source).
  "pyodbc>=5.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  # Gate C demo surface — trace UI backend (D24)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
