enterprise_id: enterprise
display_name: MMC Enterprise Nodes

kb:
  kb_id_env: FOUNDRY_IQ_KB_ENTERPRISE_ID
  sources:
    supply_chain:
      node: supply-chain
      paths: ["enterprise/supply-chain/data", "enterprise/supply-chain/kb"]
    procurement:
      node: procurement
      paths: ["enterprise/procurement/data", "enterprise/procurement/kb"]
    engineering_plm:
      node: engineering-plm
      paths: ["enterprise/engineering-plm/data", "enterprise/engineering-plm/kb"]
    enterprise_quality:
      node: enterprise-quality
      paths: ["enterprise/enterprise-quality/data", "enterprise/enterprise-quality/kb"]
    demand_program:
      node: demand-program
      paths: ["enterprise/demand-program/data", "enterprise/demand-program/kb"]

agents:
  - role: supply-chain
    name: ent-supply-chain
    display_name: Supply Chain
    kb_sources: [supply_chain]
    tools: [erp, supplier, tms]
    skills:
      - id: supplier_health
        description: Supplier health & disruption impact
      - id: bom_where_used
        description: BOM explode & where-used
      - id: alt_source_lookup
        description: Alternate-source and inbound-logistics ETA

  - role: procurement
    name: ent-procurement
    display_name: Procurement & Cost
    kb_sources: [procurement]
    tools: [procurement]
    skills:
      - id: should_cost_analysis
        description: Should-cost and PO-impact analysis
      - id: contract_terms
        description: Contract terms and expedite-cost lookup
      - id: spend_rollup
        description: Spend and supplier-tier rollup

  - role: engineering-plm
    name: ent-engineering-plm
    display_name: Engineering / PLM
    kb_sources: [engineering_plm]
    tools: [plm]
    skills:
      - id: eco_status
        description: ECO / ECN status and impact
      - id: part_revision_lookup
        description: Part revision and effectivity lookup
      - id: where_installed
        description: Cross-plant where-installed lookup

  - role: enterprise-quality
    name: ent-quality
    display_name: Enterprise Quality
    kb_sources: [enterprise_quality]
    tools: [warranty]
    skills:
      - id: warranty_clustering
        description: Warranty-claim clustering
      - id: cross_plant_defect_trends
        description: Cross-plant defect trends
      - id: recall_threshold
        description: Recall-threshold and safety call

  - role: demand-program
    name: ent-demand-program
    display_name: Demand / Program
    kb_sources: [demand_program]
    tools: [demand]
    skills:
      - id: order_signal
        description: OEM order signal and build-mix lookup
      - id: launch_readiness
        description: Launch-program readiness
      - id: demand_allocation
        description: Demand to plant allocation
