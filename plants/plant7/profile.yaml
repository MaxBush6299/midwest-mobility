plant_id: plant7
display_name: MMC Plant 7 (Illinois)
location:
  state: IL
  country: US
shifts:
  - { id: A, hours: "06:00-14:00" }
  - { id: B, hours: "14:00-22:00" }
  - { id: C, hours: "22:00-06:00" }
lines:
  - { id: L1, name: Stamping/Forming, equipment_prefix: L1-PRS- }
  - { id: L2, name: Assembly/Robot Cells, equipment_prefix: L2-ROB- }
  - { id: L3, name: Conveyor/Pack-Out, equipment_prefix: L3-CNV- }
standards: [OSHA-29CFR1910, ISO-45001, ISO-9001, ANSI-RIA-R15.06, NFPA-70E]

kb:
  kb_id_env: FOUNDRY_IQ_KB_PLANT7_ID
  sources:
    ehs:
      paths: ["plants/plant7/kb/02_EHS_Internal", "shared/kb/regulatory-reference/OSHA"]
    ehs_restricted:
      # Sensitivity-demo source: confidential incident brief. Only the internal
      # plant7-ehs agent has this in its kb_sources mapping. The external auditor
      # agent has access to the same KB but its profile omits this source, so
      # the per-agent readable-source mapping prevents it from being retrieved.
      paths: ["plants/plant7/kb/02_EHS_Internal_Restricted"]
    maintenance:
      paths: ["plants/plant7/kb/03_Maintenance", "shared/kb/oem-manuals"]
    quality_ops:
      # Procedures / SOPs only — the row data in 08_Logs_Data now lives in
      # the SQL knowledge sources below (training_data / pm_data / incident_data).
      paths: ["plants/plant7/kb/04_Quality", "plants/plant7/kb/05_Ops_Shift"]
    training_data:
      sql_table: dbo.training_log
      description: "Plant 7 training records (employees, courses, expirations)."
    pm_data:
      sql_table: dbo.pm_schedule
      description: "Plant 7 preventive maintenance schedule + completion log."
    incident_data:
      sql_table: dbo.incident_log
      description: "Plant 7 EHS incident log (near-misses, injuries, CAPAs)."

agents:
  - role: ehs
    display_name: Plant 7 EHS / Safety
    kb_sources: [ehs, ehs_restricted, incident_data]
    tools: [capa]
    skills:
      - id: hazard_loto_lookup
        description: Hazard & LOTO requirement lookup
      - id: incident_clustering
        description: Incident clustering & repeat-cause analysis
      - id: osha_iso_compliance_check
        description: OSHA / ISO 45001 compliance check
  - role: maintenance
    display_name: Plant 7 Maintenance & Reliability
    kb_sources: [maintenance, pm_data]
    tools: [cmms, scada]
    skills:
      - id: pm_status
        description: PM status & overdue work-order lookup
      - id: asset_history
        description: Asset history & jam-clear procedure
      - id: spare_part_lookup
        description: Spare-part lookup & OEE / downtime
  - role: quality
    display_name: Plant 7 Quality
    kb_sources: [quality_ops, incident_data]
    tools: [qms]
    skills:
      - id: ncr_capa_status
        description: NCR / CAPA status & 8D containment
      - id: defect_safety_linkage
        description: Defect → safety-issue linkage
      - id: first_piece_inspection
        description: First-piece / changeover inspection
  - role: shiftops
    display_name: Plant 7 Shift Ops
    kb_sources: [quality_ops, pm_data, incident_data]
    tools: [mes]
    skills:
      - id: handover_summary
        description: Shift-handover summary & open items
      - id: changeover_guidance
        description: Changeover / SMED step guidance
      - id: line_stop_support
        description: Line-stop decision support
  - role: training
    display_name: Plant 7 Training / Competency
    kb_sources: [quality_ops, training_data, incident_data]
    tools: [lms]
    skills:
      - id: cert_status
        description: Certification status & expiration lookup
      - id: qualified_for_task
        description: "Who is qualified for this task?"
      - id: training_gap_link
        description: Training-gap vs. incident linkage
  - role: external-auditor
    display_name: Plant 7 External Auditor
    # Sensitivity-demo agent. Reads the SAME KB as plant7-ehs but its
    # kb_sources mapping deliberately OMITS `ehs_restricted` and
    # `incident_data` — proves the per-agent readable-source mapping in
    # governance/kb_metadata.json governs what an agent can retrieve even
    # when the underlying KB physically contains the data.
    kb_sources: [ehs]
    tools: []
    skills:
      - id: external_audit_walkdown
        description: External-auditor compliance walk-down support
      - id: published_policy_lookup
        description: Look up only publicly-disclosed EHS policy
